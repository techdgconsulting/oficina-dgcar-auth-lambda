name: Auth CPF Lambda

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: "package"
        type: choice
        options:
          - package
          - deploy
      environment:
        description: "Target environment"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint sources
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package Lambda
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-cpf-lambda
          path: dist/auth-cpf-lambda.zip

  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Package Lambda
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.AUTH_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://dist/auth-cpf-lambda.zip
